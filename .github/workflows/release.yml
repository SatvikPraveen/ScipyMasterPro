name: Release

# Tag a commit on main with `vX.Y.Z` (matching pyproject.toml) to:
#   1. run the test suite,
#   2. build the sdist + wheel,
#   3. publish a GitHub Release with the artifacts and auto-generated notes,
#   4. (optional) publish to PyPI via trusted publishing once a `pypi`
#      environment is configured for this repository.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -m pip install tomli
          pkg=$(python -c "import tomli;print(tomli.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject: $pkg  tag: $tag"
          [ "$pkg" = "$tag" ] || { echo "::error::tag $tag does not match pyproject version $pkg"; exit 1; }

  test:
    name: Test
    needs: verify
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install + test
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
          python synthetic_data/generate_synthetic_data.py
          pytest tests/ -n auto

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    name: Publish to PyPI (trusted publishing)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scipymasterpro/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - "requirements*.txt"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build and test image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (amd64, loaded locally for tests)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: scipymasterpro:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Streamlit service
        run: |
          docker run -d --name t-app -p 8501:8501 scipymasterpro:test app
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8501/_stcore/health && break
            sleep 2
          done
          curl -fsS http://localhost:8501/_stcore/health
          docker rm -f t-app

      - name: Test JupyterLab service
        run: |
          docker run -d --name t-lab -p 8888:8888 scipymasterpro:test jupyter
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8888/lab -o /dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:8888/lab -o /dev/null
          docker rm -f t-lab

      - name: Test CLI + unit tests inside the image
        run: |
          docker run --rm scipymasterpro:test scipymasterpro info
          docker run --rm scipymasterpro:test python -m pytest tests/ -m "not app" -q -p no:cacheprovider -x

      - name: Test Docker Compose
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl -fsS http://localhost:8501/_stcore/health
          curl -fsS http://localhost:8888/lab -o /dev/null
          docker compose down -v

      - name: Push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload Trivy results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

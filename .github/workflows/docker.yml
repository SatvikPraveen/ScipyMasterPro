name: Docker Build & Push

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Docker Build and Test
  # ============================================================================
  build-and-test:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: test-image:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1

    - name: Test Docker image - Jupyter
      run: |
        docker run -d --name test-jupyter -p 8888:8888 test-image:latest \
          bash -c "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root"
        sleep 15
        docker exec test-jupyter curl -f http://localhost:8888/lab || exit 1
        docker stop test-jupyter
        docker rm test-jupyter

    - name: Test Docker image - Streamlit
      run: |
        docker run -d --name test-streamlit -p 8501:8501 test-image:latest \
          bash -c "streamlit run streamlit_app/app.py --server.port=8501 --server.headless=true --server.address=0.0.0.0"
        sleep 20
        docker exec test-streamlit curl -f http://localhost:8501/_stcore/health || exit 1
        docker stop test-streamlit
        docker rm test-streamlit

    - name: Test Docker Compose
      run: |
        docker-compose up -d
        sleep 30
        curl -f http://localhost:8888/lab || exit 1
        curl -f http://localhost:8501/_stcore/health || exit 1
        docker-compose down

    - name: Build and push Docker image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    - name: Scan image for vulnerabilities
      if: github.event_name != 'pull_request'
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true

    - name: Upload Trivy scan results to GitHub Security tab
      if: github.event_name != 'pull_request'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

  # ============================================================================
  # Docker Image Size Analysis
  # ============================================================================
  analyze-image:
    name: Analyze Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image for analysis
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: analyze-image:latest

    - name: Analyze image with dive
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          wagoodman/dive:latest analyze-image:latest --ci
      continue-on-error: true

    - name: Get image size
      run: |
        SIZE=$(docker image inspect analyze-image:latest --format='{{.Size}}' | awk '{print $1/1024/1024 " MB"}')
        echo "Image size: $SIZE"
        echo "IMAGE_SIZE=$SIZE" >> $GITHUB_ENV

    - name: Comment PR with image size
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 🐳 Docker Image Analysis\n\n**Image Size:** ${process.env.IMAGE_SIZE}\n\n✅ Docker build successful!`
          })
      continue-on-error: true

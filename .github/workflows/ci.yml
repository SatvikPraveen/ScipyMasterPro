name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ===========================================================================
  # Formatting + linting (blocking)
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linters
        run: python -m pip install black==25.11.0 isort==6.1.0 ruff "bandit[toml]"

      - name: black
        run: black --check --diff .

      - name: isort
        run: isort --check --diff .

      - name: ruff
        run: ruff check --output-format=github .

      - name: bandit
        run: bandit -c pyproject.toml -r utils/ streamlit_app/ synthetic_data/ scipymasterpro/ -q

  # ===========================================================================
  # Static analysis (advisory: reports but never blocks)
  # ===========================================================================
  static-analysis:
    name: Static analysis (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install mypy pylint

      - name: mypy
        run: mypy utils/ synthetic_data/ scipymasterpro/

      - name: pylint
        if: always()
        run: pylint utils/ streamlit_app/ synthetic_data/ scipymasterpro/

  # ===========================================================================
  # Unit + property + app tests across OS / Python
  # ===========================================================================
  test:
    name: Test py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - os: macos-latest
            python-version: "3.12"
            experimental: false
          - os: windows-latest
            python-version: "3.12"
            experimental: false
          - os: ubuntu-latest
            python-version: "3.14"
            experimental: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Generate synthetic data
        run: python synthetic_data/generate_synthetic_data.py

      - name: Unit + property tests
        run: >
          pytest tests/ -m "not app" -n auto
          --cov --cov-report=xml --cov-report=term-missing

      - name: Streamlit app smoke tests
        run: pytest tests/ -m app -n 2

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ===========================================================================
  # Execute every notebook end-to-end
  # ===========================================================================
  notebooks:
    name: Execute notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install nbmake pytest-xdist ipykernel

      - name: Generate synthetic data
        run: python synthetic_data/generate_synthetic_data.py

      - name: Run notebooks with nbmake
        run: pytest --nbmake --nbmake-timeout=900 notebooks/ shared_notebooks/ -n 4

  # ===========================================================================
  # Package build + docs build
  # ===========================================================================
  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist + wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          scipymasterpro --version
          scipymasterpro info

      - uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: dist/

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[docs]"

      - name: mkdocs build --strict
        run: mkdocs build --strict

  # ===========================================================================
  # Gate used by branch protection
  # ===========================================================================
  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [lint, test, notebooks, build, docs]
    if: always()
    steps:
      - name: Verify required jobs
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          NOTEBOOKS: ${{ needs.notebooks.result }}
          BUILD: ${{ needs.build.result }}
          DOCS: ${{ needs.docs.result }}
        run: |
          ok=true
          for job in LINT TEST NOTEBOOKS BUILD DOCS; do
            echo "$job: ${!job}"
            [ "${!job}" = "success" ] || ok=false
          done
          $ok || { echo "::error::one or more required jobs did not succeed"; exit 1; }

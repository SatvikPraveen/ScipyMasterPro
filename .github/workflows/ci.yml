name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'notebooks/**'
      - 'exports/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'notebooks/**'
      - 'exports/**'
  workflow_dispatch:

jobs:
  # ============================================================================
  # Linting and Code Quality
  # ============================================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort pylint flake8 bandit[toml]

    - name: Check formatting with black
      run: black --check --diff .
      continue-on-error: false

    - name: Check import sorting with isort
      run: isort --check --diff .
      continue-on-error: false

    - name: Lint with pylint
      run: pylint utils/ streamlit_app/ synthetic_data/ || true
      continue-on-error: true

    - name: Lint with flake8
      run: flake8 utils/ streamlit_app/ synthetic_data/ --max-line-length=100 --extend-ignore=E203,E266,E501,W503
      continue-on-error: true

    - name: Security check with bandit
      run: bandit -r utils/ streamlit_app/ synthetic_data/ -f screen || true
      continue-on-error: true

  # ============================================================================
  # Type Checking
  # ============================================================================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mypy types-all
        pip install -r requirements.txt

    - name: Type check with mypy
      run: mypy utils/ streamlit_app/ synthetic_data/ --ignore-missing-imports || true
      continue-on-error: true

  # ============================================================================
  # Testing
  # ============================================================================
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          # Reduce matrix complexity for faster CI
          - os: macos-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.10"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libatlas-base-dev gfortran

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist
        pip install -r requirements.txt

    - name: Generate synthetic data
      run: python synthetic_data/generate_synthetic_data.py

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=utils --cov=streamlit_app --cov=synthetic_data \
               --cov-report=xml --cov-report=term-missing \
               --cov-report=html -n auto
      continue-on-error: ${{ matrix.python-version == '3.12' }}  # Allow 3.12 to fail

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload coverage artifacts
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/

  # ============================================================================
  # Package Build
  # ============================================================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package with twine
      run: twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages
        path: dist/

  # ============================================================================
  # Security Scan
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit[toml]
        pip install -r requirements.txt

    - name: Run safety check
      run: safety check --json || true
      continue-on-error: true

    - name: Run bandit
      run: bandit -r utils/ streamlit_app/ synthetic_data/ -f json -o bandit-report.json || true
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json

  # ============================================================================
  # All Checks Passed
  # ============================================================================
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, build, security]
    if: always()
    
    steps:
    - name: Check if all jobs passed
      run: |
        if [ "${{ needs.lint.result }}" != "success" ]; then
          echo "Lint job failed"
          exit 1
        fi
        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "Test job failed"
          exit 1
        fi
        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "Build job failed"
          exit 1
        fi
        echo "All checks passed!"

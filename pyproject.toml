[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scipymasterpro"
version = "1.0.0"
description = "Comprehensive SciPy mastery toolkit with notebooks, utilities, and interactive app"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
authors = [
    {name = "Satvik Praveen", email = "satvikpraveen@example.com"}
]
keywords = ["scipy", "statistics", "data-science", "machine-learning", "optimization", "inference", "hypothesis-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering",
    "Topic :: Education",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "plotly>=5.18",
    "statsmodels>=0.14",
    "streamlit>=1.33",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.5",
    "pylint>=2.17",
    "pre-commit>=3.3",
    "jupyterlab>=3.6",
    "flake8>=6.0",
    "bandit>=1.7",
    "safety>=2.3",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "myst-parser>=2.0",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.22",
]
notebook = [
    "jupyterlab>=3.6",
    "ipykernel>=6.25",
    "nbconvert>=7.8",
]

[project.urls]
Homepage = "https://github.com/SatvikPraveen/ScipyMasterPro"
Documentation = "https://github.com/SatvikPraveen/ScipyMasterPro/wiki"
Repository = "https://github.com/SatvikPraveen/ScipyMasterPro"
Issues = "https://github.com/SatvikPraveen/ScipyMasterPro/issues"
Changelog = "https://github.com/SatvikPraveen/ScipyMasterPro/blob/main/CHANGELOG.md"

[project.scripts]
scipy-app = "streamlit_app.app:main"
scipy-generate-data = "synthetic_data.generate_synthetic_data:main"

[tool.setuptools]
packages = ["utils", "streamlit_app", "streamlit_app.pages", "synthetic_data"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = [
    "--cov=utils",
    "--cov=streamlit_app",
    "--cov=synthetic_data",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--strict-markers",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["utils", "streamlit_app", "synthetic_data"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | notebooks
  | exports
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["venv/*", "env/*", "notebooks/*", "exports/*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
strict_equality = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "matplotlib.*",
    "seaborn.*",
    "plotly.*",
    "statsmodels.*",
    "streamlit.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.10"
jobs = 0
suggestion-mode = true
fail-under = 8.0

[tool.pylint.messages_control]
disable = [
    "C0330",
    "C0326",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "too-many-branches",
    "missing-module-docstring",
    "invalid-name",
]

[tool.pylint.format]
max-line-length = 100
indent-string = "    "

[tool.pylint.basic]
good-names = ["i", "j", "k", "df", "ax", "fig", "x", "y", "z", "e", "f", "g", "n", "p", "q", "r", "t", "v", "w", "X", "Y"]

[tool.pylint.design]
max-args = 10
max-attributes = 15
max-public-methods = 25

[tool.bandit]
exclude_dirs = ["tests", "venv", "env", ".venv", "notebooks"]
skips = ["B101", "B601"]

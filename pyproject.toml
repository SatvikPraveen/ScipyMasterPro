[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scipymasterpro"
version = "1.1.0"
description = "Comprehensive SciPy mastery toolkit with notebooks, utilities, and interactive app"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0"}
authors = [
    {name = "Satvik Praveen", email = "satvikpraveen707@gmail.com"}
]
keywords = ["scipy", "statistics", "data-science", "machine-learning", "optimization", "inference", "hypothesis-testing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering",
    "Topic :: Education",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",
    "statsmodels>=0.14",
    "streamlit>=1.50",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "nbmake>=1.5",
    "black==25.11.0",
    "isort==6.1.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pylint>=3.0",
    "pre-commit>=3.7",
    "bandit[toml]>=1.7",
    "build>=1.2",
    "twine>=5.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "pymdown-extensions>=10.8",
]
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[project.urls]
Homepage = "https://github.com/SatvikPraveen/ScipyMasterPro"
Documentation = "https://satvikpraveen.github.io/ScipyMasterPro/"
Repository = "https://github.com/SatvikPraveen/ScipyMasterPro"
Issues = "https://github.com/SatvikPraveen/ScipyMasterPro/issues"
Changelog = "https://github.com/SatvikPraveen/ScipyMasterPro/blob/main/docs/CHANGELOG.md"

[project.scripts]
scipymasterpro = "scipymasterpro.cli:main"
scipy-app = "scipymasterpro.cli:run_app"
scipy-generate-data = "synthetic_data.generate_synthetic_data:main"

[tool.setuptools]
packages = ["scipymasterpro", "utils", "streamlit_app", "streamlit_app.pages", "synthetic_data"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.csv"]

# ============================================================================
# Testing
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = [
    "--strict-markers",
    "-ra",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "app: Streamlit application smoke tests (deselect with '-m \"not app\"')",
    "property: property-based tests driven by Hypothesis",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["utils", "streamlit_app", "synthetic_data", "scipymasterpro"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/env/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# ============================================================================
# Formatting
# ============================================================================
[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.ruff_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | notebooks
  | exports
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["venv/*", ".venv/*", "env/*", "notebooks/*", "exports/*"]

# ============================================================================
# Linting (ruff replaces flake8)
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "shared_notebooks", "exports", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",  # line length is handled by black
    "E203",  # whitespace before ':' (black compatible)
    "B008",  # function calls in argument defaults are fine for numpy arrays
    "B905",  # zip() without strict= is fine on the supported Python versions
    "UP006", # keep typing.Dict/List in older test helpers
    "UP035", # keep typing imports in older test helpers
]

[tool.ruff.lint.per-file-ignores]
# Streamlit scripts must patch sys.path before importing project modules,
# and they carry markdown strings with two-space line breaks.
"streamlit_app/**" = ["E402", "W291"]
"tests/**" = ["F841"]

# ============================================================================
# Type checking (advisory)
# ============================================================================
[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["streamlit_app.*", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ============================================================================
# Pylint (advisory)
# ============================================================================
[tool.pylint.main]
py-version = "3.11"
jobs = 0
suggestion-mode = true
fail-under = 8.0

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-statements",
    "too-many-branches",
    "missing-module-docstring",
    "invalid-name",
]

[tool.pylint.format]
max-line-length = 100
indent-string = "    "

[tool.pylint.basic]
good-names = ["i", "j", "k", "df", "ax", "fig", "x", "y", "z", "e", "f", "g", "n", "p", "q", "r", "t", "v", "w", "X", "Y"]

[tool.pylint.design]
max-args = 10
max-attributes = 15
max-public-methods = 25

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "env", "notebooks", "shared_notebooks"]
skips = ["B101", "B601"]

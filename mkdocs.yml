site_name: ScipyMasterPro Documentation
site_description: Comprehensive SciPy mastery toolkit with notebooks, utilities, and interactive app
site_author: Satvik Praveen
site_url: https://satvikpraveen.github.io/ScipyMasterPro/

repo_name: SatvikPraveen/ScipyMasterPro
repo_url: https://github.com/SatvikPraveen/ScipyMasterPro
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

nav:
  - Home: index.md
  - User Guide:
      - Notebooks: user_guide/notebooks.md
      - Streamlit App: user_guide/streamlit_app.md
      - Utilities: user_guide/utilities.md
      - Synthetic Data: user_guide/synthetic_data.md
  - Tutorials:
      - Getting Started: tutorials/getting_started.md
      - Statistical Testing: tutorials/statistical_testing.md
      - Distribution Fitting: tutorials/distribution_fitting.md
      - Bootstrap Methods: tutorials/bootstrap.md
  - API Reference:
      - Overview: api_reference/index.md
      - Statistical Tests: api_reference/stats_tests.md
      - Distribution Fitting: api_reference/distribution.md
      - PDF and ECDF: api_reference/pdf_ecdf.md
      - Simulation and Resampling: api_reference/simulation.md
      - Inference: api_reference/inference.md
      - Power Analysis: api_reference/power.md
      - Optimization: api_reference/optimization.md
      - Linear Algebra: api_reference/linear_algebra.md
      - Interpolation and Curve Fitting: api_reference/interpolation.md
      - Visualization: api_reference/visualization.md
      - Command Line: api_reference/cli.md
  - Developer Guide:
      - Setup: developer/setup.md
      - Testing: developer/testing.md
      - Code Style: developer/code_style.md
      - CI/CD: developer/cicd.md
  - About:
      - Contributing: about/contributing.md
      - Code of Conduct: about/CODE_OF_CONDUCT.md
      - Changelog: about/changelog.md
      - Security: about/security.md
      - License: about/license.md

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            heading_level: 2
  - autorefs

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SatvikPraveen
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/scipymasterpro/

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js


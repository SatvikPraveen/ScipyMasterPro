# Docker Compose v2 (`docker compose up`). The `version:` key is obsolete and omitted.
x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  image: scipymasterpro:local
  environment:
    - PYTHONUNBUFFERED=1
  volumes:
    - ./notebooks:/app/notebooks
    - ./shared_notebooks:/app/shared_notebooks
    - ./exports:/app/exports
    - ./synthetic_data/exports:/app/synthetic_data/exports
  restart: unless-stopped
  networks:
    - scipymasterpro

services:
  streamlit:
    <<: *common
    container_name: scipymasterpro-streamlit
    command: ["app"]
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  jupyter:
    <<: *common
    container_name: scipymasterpro-jupyter
    command: ["jupyter"]
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/lab"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  scipymasterpro:
    driver: bridge

# Run `pre-commit install` once, then hooks run on every commit.
# Run everything manually with `pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Streamlit pages carry markdown strings whose two-space line breaks are meaningful.
        exclude: ^(exports/|notebooks/|shared_notebooks/|streamlit_app/)
      - id: end-of-file-fixer
        exclude: ^(exports/|notebooks/|shared_notebooks/)
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: ["--fix"]

  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black

  - repo: https://github.com/pycqa/isort
    rev: 6.1.0
    hooks:
      - id: isort

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-q"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/

  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-black
        files: ^(notebooks/|shared_notebooks/).*\.ipynb$
      - id: nbqa-isort
        files: ^(notebooks/|shared_notebooks/).*\.ipynb$

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        files: ^(notebooks/|shared_notebooks/).*\.ipynb$
        args: ["--keep-count", "--keep-output"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--skip=*.ipynb,*.csv,*.json,*.html,*.txt,exports/*,.venv/*", "--ignore-words-list=nd,jupyter,fo,fro"]

default_language_version:
  python: python3

exclude: |
  (?x)^(
      \.venv/.*|venv/.*|env/.*|
      __pycache__/.*|\.pytest_cache/.*|\.mypy_cache/.*|\.ruff_cache/.*|
      exports/.*|dist/.*|build/.*|site/.*|.*\.egg-info/.*
  )$
